<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050708">
<title>DOMPETQ - Catatan Keuangan</title>

<style>
:root {
  --bg: #dce9df;
  --green: #347b55;
  --green-dark: #245c3d;
  --green-soft: #b9d4c0;
  --dark: #244333;
  --muted: #718879;
  --shadow: #b8c7bb;
  --light: #fafffb;
  --red: #bd6868;
}

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--dark);
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 24px 18px 50px;
}

header {
  margin-bottom: 25px;
  text-align: center;
  padding: 12px 0 8px;
}

.hero-logo {
  display: block;
  width: min(100%, 238px);
  height: auto;
  aspect-ratio: 3 / 2;
  object-fit: contain;
  margin: 0 auto 14px;
  padding: 7px;
  border-radius: 18px;
  background: linear-gradient(145deg, #07110b, #14251a);
  border: 1px solid rgba(255,255,255,.42);
  box-shadow: 0 9px 22px rgba(20, 55, 34, .24),
              inset 0 1px 0 rgba(255,255,255,.16);
}

header h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: 3px;
  font-weight: 800;
  color: var(--green-dark);
}

header p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 7px;
}

.app-footer {
  text-align: center;
  padding: 8px 0 20px;
  margin-top: 4px;
}

.reset-btn {
  width: 100%;
  color: #fff;
  background: linear-gradient(135deg, #c45f5f, #a83f3f);
  box-shadow: 5px 5px 10px var(--shadow),
             -5px -5px 10px var(--light);
}

.footer-note {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 11px;
}

/* SALDO */

.balance-card {
  background: linear-gradient(135deg,#347b55,#4c966b);
  color: white;
  padding: 25px;
  border-radius: 24px;
  box-shadow: 8px 8px 18px var(--shadow),
             -8px -8px 18px var(--light);
  margin-bottom: 22px;
}

.balance-card small {
  opacity: .8;
  font-size: 12px;
}

.balance {
  font-size: 34px;
  font-weight: bold;
  margin: 12px 0 25px;
  overflow-wrap: anywhere;
}

/* LIQUID NEON WAVE NAVIGATION — inspired by Glassy Navigation Tabs V5 */
.summary-tabs {
  --nav-gap: 0px;
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 0;
  padding: 3px 4px 5px;
  min-height: 66px;
  border-radius: 40px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.105), rgba(255,255,255,.025)),
    rgba(26, 35, 30, .82);
  border: 1px solid rgba(255,255,255,.26);
  box-shadow: 0 12px 28px rgba(10,35,20,.22),
              inset 0 1px 0 rgba(255,255,255,.23),
              inset 0 -1px 0 rgba(0,0,0,.12);
  -webkit-backdrop-filter: blur(20px) saturate(1.35);
  backdrop-filter: blur(20px) saturate(1.35);
  overflow: hidden;
  isolation: isolate;
  touch-action: pan-y;
  user-select: none;
  -webkit-user-select: none;
}
.summary-wave {
  position:absolute;
  z-index:0;
  inset:0;
  width:100%;
  height:100%;
  overflow:visible;
  pointer-events:none;
}
.summary-wave .wave-soft {
  fill:none; stroke:rgba(75,255,220,.30); stroke-width:8;
  stroke-linecap:round; stroke-linejoin:round;
  filter:blur(4px);
}
.summary-wave .wave-glow {
  fill:none; stroke:#54ffe0; stroke-width:4;
  stroke-linecap:round; stroke-linejoin:round;
  filter:drop-shadow(0 0 3px #59ffe5) drop-shadow(0 0 7px rgba(46,255,218,.95));
}
.summary-wave .wave-core {
  fill:none; stroke:#c9fff5; stroke-width:1.25;
  stroke-linecap:round; stroke-linejoin:round;
  opacity:.95;
}
.summary-tabs::after {
  content:"";
  position:absolute; z-index:0; left:0; right:0; bottom:3px;
  height:1px;
  background:linear-gradient(90deg, transparent, rgba(91,255,225,.28) 8%, rgba(91,255,225,.75) 50%, rgba(91,255,225,.28) 92%, transparent);
  box-shadow:0 0 8px rgba(68,255,220,.42);
  pointer-events:none;
}
.summary-tab {
  position:relative;
  z-index:1;
  min-width:0;
  min-height:56px;
  padding:17px 2px 7px;
  border:0;
  border-radius:14px;
  background:transparent;
  color:rgba(255,255,255,.72);
  font-size:10px;
  font-weight:700;
  line-height:1.15;
  white-space:nowrap;
  text-align:center;
  transition:color 240ms ease, text-shadow 240ms ease, transform 240ms ease;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
.summary-tab svg {
  display:block;
  width:25px;
  height:25px;
  margin:0 auto;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.18));
  transition:transform 220ms ease, filter 220ms ease;
}
.summary-tab[aria-selected="true"] svg {
  transform:translateY(-1px) scale(1.08);
  filter:drop-shadow(0 0 5px rgba(82,255,224,.72));
}
.summary-tab[aria-selected="true"] {
  color:#eafffa;
  text-shadow:0 0 8px rgba(82,255,224,.8), 0 0 16px rgba(82,255,224,.48);
}
.summary-tab:active { transform:scale(.94); }
.summary-tab:focus-visible { outline:2px solid rgba(111,255,229,.9); outline-offset:-4px; }
.summary-detail {
  min-height:82px; margin-top:15px; padding:14px 16px; border-radius:17px;
  background:linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.07)), rgba(9,38,23,.16);
  border:1px solid rgba(255,255,255,.20);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 8px 20px rgba(8,35,20,.12);
  -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); overflow:hidden;
}
.summary-detail span { display:block; font-size:11px; opacity:.84; margin-bottom:8px; }
.summary-detail strong { display:block; font-size:21px; overflow-wrap:anywhere; letter-spacing:.2px; }
@media(max-width:380px) {
  .summary-tabs { min-height:62px; border-radius:35px; }
  .summary-tab { min-height:54px; font-size:9px; padding:15px 1px 6px; }
}
@media(prefers-reduced-motion:reduce) {
  .summary-tab,.summary-detail { transition:none!important; animation:none!important; }
}
/* PANEL */

.panel {
  background: var(--bg);
  padding: 22px;
  border-radius: 20px;
  box-shadow: 7px 7px 15px var(--shadow),
             -7px -7px 15px var(--light);
  margin-bottom: 22px;
}

.panel h3 {
  margin: 0 0 18px;
  font-size: 16px;
}

/* INPUT */

label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  font-weight: bold;
  margin: 13px 0 7px;
}

input {
  width: 100%;
  padding: 14px;
  border: none;
  outline: none;
  border-radius: 12px;
  background: var(--bg);
  color: var(--dark);
  box-shadow: inset 4px 4px 8px var(--shadow),
              inset -4px -4px 8px var(--light);
  font-size: 14px;
}

button {
  border: none;
  cursor: pointer;
  font-weight: bold;
  border-radius: 12px;
  padding: 14px;
  font-size: 13px;
  transition: .2s ease;
}

button:active {
  transform: scale(.97);
}

/* TOMBOL SIMPAN */

.primary {
  width: 100%;
  color: white;
  background: linear-gradient(135deg,#4c966b,#347b55);
  box-shadow: 5px 5px 10px var(--shadow),
             -5px -5px 10px var(--light);
  margin-top: 17px;
}

/* TOMBOL TRANSAKSI */

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}

/* PENGELUARAN - TOMBOL UTAMA */

.expense-btn {
  background: linear-gradient(145deg,#245f3e,#17472e);
  color: #ffffff;
  box-shadow: 5px 5px 10px #aebfb1,
             -5px -5px 10px #f4fff6;
}

.expense-btn:hover {
  background: linear-gradient(145deg,#1d5134,#123d27);
}

/* PEMASUKAN - TOMBOL SEKUNDER */

.income-btn {
  background: var(--bg);
  color: var(--green);
  box-shadow: 5px 5px 10px var(--shadow),
             -5px -5px 10px var(--light);
}

.income-btn:hover {
  color: var(--green-dark);
  background: #d3e4d7;
}

/* TRANSAKSI */

.transaction {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid #b8c7bb80;
}

.transaction:last-child {
  border-bottom: none;
}

.icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--bg);
  box-shadow: 4px 4px 8px var(--shadow),
             -4px -4px 8px var(--light);
  font-size: 18px;
  flex-shrink: 0;
}

.info {
  flex: 1;
  min-width: 0;
}

.info strong {
  display: block;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.info small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}

.amount {
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
}

.income {
  color: var(--green);
}

.expense {
  color: var(--red);
}

.delete {
  background: none;
  color: var(--muted);
  font-size: 19px;
  padding: 4px;
}

.empty {
  text-align: center;
  padding: 25px 5px;
  color: var(--muted);
  font-size: 12px;
}

@media(max-width:380px) {
  .balance {
    font-size: 27px;
  }

  .panel {
    padding: 17px;
  }

  .buttons {
    gap: 9px;
  }

  .buttons button {
    padding: 13px 8px;
    font-size: 12px;
  }
}


/* =========================================================
   DOMPETQ — DARK BOTANICAL GLASS UI
   Background daun hitam + panel frosted glass.
   Seluruh fungsi JavaScript asli tetap dipertahankan.
   ========================================================= */
:root {
  --bg: #080b0d;
  --green: #71d49a;
  --green-dark: #a1f0bd;
  --green-soft: #214c37;
  --dark: #f0f5f2;
  --muted: #b1bdb7;
  --shadow: rgba(0,0,0,.42);
  --light: rgba(255,255,255,.13);
  --red: #ff9292;
}

html { min-height: 100%; background: #050708; }
body {
  min-height: 100vh;
  color: var(--dark);
  background:
    linear-gradient(180deg, rgba(3,6,8,.48), rgba(3,6,8,.72)),
    url("assets/daun-hitam.jpg") center center / cover fixed no-repeat,
    #070a0c;
  background-color: #070a0c;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 12%, rgba(60,115,83,.13), transparent 48%),
              linear-gradient(180deg, rgba(0,0,0,.12), rgba(0,0,0,.34));
}
.container {
  position: relative;
  z-index: 1;
  padding-top: 22px;
}
header h1 {
  color: #e5f8ec;
  text-shadow: 0 2px 16px rgba(93,255,164,.2);
}
header p { color: rgba(231,243,236,.72); }
.hero-logo {
  background: linear-gradient(145deg, rgba(7,17,11,.72), rgba(20,37,26,.58));
  border: 1px solid rgba(255,255,255,.23);
  box-shadow: 0 12px 30px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.2);
  -webkit-backdrop-filter: blur(18px) saturate(1.25);
  backdrop-filter: blur(18px) saturate(1.25);
}

/* Kartu saldo: kaca gelap dengan aksen emerald */
.balance-card {
  position: relative;
  overflow: hidden;
  color: #f4fff8;
  background: linear-gradient(135deg, rgba(18,48,34,.72), rgba(8,19,15,.62));
  border: 1px solid rgba(198,255,220,.24);
  box-shadow: 0 18px 42px rgba(0,0,0,.34),
              inset 0 1px 0 rgba(255,255,255,.2),

}
.balance-card small { color: rgba(238,255,244,.76); }
.balance { color: #f3fff7; text-shadow: 0 0 22px rgba(93,255,164,.14); }

/* Navigasi Liquid Neon tetap dipertahankan */
.summary-tabs {
  background: linear-gradient(180deg, rgba(255,255,255,.13), rgba(255,255,255,.035)), rgba(5,15,11,.68);
  border-color: rgba(223,255,235,.24);
  box-shadow: 0 12px 28px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.2);
  -webkit-backdrop-filter: blur(22px) saturate(1.4);
  backdrop-filter: blur(22px) saturate(1.4);
}
.summary-detail {
  background: linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.055)), rgba(7,24,15,.48);
  border-color: rgba(255,255,255,.22);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 10px 24px rgba(0,0,0,.2);
  -webkit-backdrop-filter: blur(22px) saturate(1.35);
  backdrop-filter: blur(22px) saturate(1.35);
}
.summary-detail span { color: rgba(240,250,244,.76); }
.summary-detail strong { color: #f3fff7; }

/* Panel utama */
.panel {
  position: relative;
  overflow: hidden;
  color: #edf5f0;
  background: linear-gradient(145deg, rgba(255,255,255,.135), rgba(255,255,255,.045)), rgba(9,14,13,.58);
  border: 1px solid rgba(255,255,255,.2);

.panel h3 { color: #f2faf5; }

.primary,

.expense-btn,
.reset-btn {

  color: #dfffea;

.info small, .empty, .footer-note { color: rgba(224,237,229,.62); }
.income { color: #8debb0; }
.expense { color: #ff9b9b; }
.delete { color: rgba(236,245,239,.66); }
.delete:hover { color: #ffaaaa; }

@media (prefers-reduced-transparency: reduce) {
  .balance-card, .panel, .summary-tabs, .summary-detail, input { backdrop-filter: none; -webkit-backdrop-filter: none; }
}


/* =========================================================
   DOMPETQ — GLASS REFINEMENT V2
   Terinspirasi tampilan Glassy SideBar pada video referensi:
   permukaan lebih tembus pandang, blur lebih terasa, refleksi
   diagonal, rim highlight dan tint kaca smoky-emerald.
   ========================================================= */
body {
  background:
    linear-gradient(180deg, rgba(3,5,7,.20), rgba(3,5,7,.38)),
    url("assets/daun-hitam.jpg") center center / cover fixed no-repeat,
    #070a0c;
}

.balance-card,
.panel,
.summary-detail,
.summary-tabs {
  -webkit-backdrop-filter: blur(30px) saturate(1.65) contrast(1.04);
  backdrop-filter: blur(30px) saturate(1.65) contrast(1.04);
}

.balance-card {
  background:
    linear-gradient(138deg,
      rgba(255,255,255,.19) 0%,
      rgba(255,255,255,.075) 24%,
      rgba(255,255,255,.025) 58%,
      rgba(5,18,12,.12) 100%),
    rgba(13,42,28,.34);
  border: 1px solid rgba(226,255,237,.34);
  box-shadow:
    0 22px 48px rgba(0,0,0,.30),
    0 0 0 1px rgba(255,255,255,.045),
    inset 0 1.5px 0 rgba(255,255,255,.38),
    inset 1px 0 0 rgba(255,255,255,.12),
    inset 0 -1px 0 rgba(0,0,0,.18);
}

.panel {
  background:
    linear-gradient(140deg,
      rgba(255,255,255,.17) 0%,
      rgba(255,255,255,.075) 26%,
      rgba(255,255,255,.028) 62%,
      rgba(255,255,255,.065) 100%),
    rgba(25,29,28,.30);
  border: 1px solid rgba(255,255,255,.29);
  box-shadow:
    0 20px 44px rgba(0,0,0,.30),
    0 0 0 1px rgba(255,255,255,.035),
    inset 0 1.5px 0 rgba(255,255,255,.32),
    inset 1px 0 0 rgba(255,255,255,.10),
    inset 0 -1px 0 rgba(0,0,0,.20);
}

/* Refleksi lembut seperti pantulan cahaya pada kaca */
.balance-card::after,
.panel::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 0;
  border-radius: inherit;
  pointer-events: none;
  background:
    linear-gradient(118deg,
      rgba(255,255,255,.12) 0%,
      rgba(255,255,255,.045) 16%,
      transparent 38%,
      transparent 72%,
      rgba(255,255,255,.035) 100%),
    radial-gradient(ellipse at 12% 0%, rgba(255,255,255,.13), transparent 42%);
  opacity: .9;
}
.balance-card > *,
.panel > * { position: relative; z-index: 1; }

.balance-card::before,
.panel::before {
  z-index: 2;
  height: 1px;
  background: linear-gradient(90deg,
    transparent 2%,
    rgba(255,255,255,.52) 22%,
    rgba(255,255,255,.18) 72%,
    transparent 100%);
}

.summary-tabs {
  background:
    linear-gradient(180deg, rgba(255,255,255,.20), rgba(255,255,255,.045)),
    rgba(16,24,21,.38);
  border-color: rgba(255,255,255,.34);
  box-shadow:
    0 14px 30px rgba(0,0,0,.25),
    inset 0 1.5px 0 rgba(255,255,255,.36),
    inset 0 -1px 0 rgba(0,0,0,.20);
}
.summary-detail {
  background:
    linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.045)),
    rgba(16,28,22,.30);
  border-color: rgba(255,255,255,.30);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.28),
    0 12px 26px rgba(0,0,0,.18);
}

input {
  background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.018)), rgba(5,9,8,.24);
  border: 1px solid rgba(255,255,255,.20);
  box-shadow:
    inset 0 2px 12px rgba(0,0,0,.24),
    inset 0 1px 0 rgba(255,255,255,.10),
    0 1px 0 rgba(255,255,255,.045);
}

.primary,
.income-btn,
.expense-btn,

    0 10px 22px rgba(0,0,0,.22),
    inset 0 1.5px 0 rgba(255,255,255,.34),

.income-btn {

    linear-gradient(145deg, rgba(255,255,255,.20), rgba(255,255,255,.055)),

}
.expense-btn {

    linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.025)),

  border-color: rgba(220,255,232,.27);
}
.primary {

input:focus {
  border-color: rgba(151,255,194,.68) !important;
  background: linear-gradient(135deg, rgba(255,255,255,.13), rgba(255,255,255,.025)), rgba(8,31,20,.07) !important;
}

/* Tombol glossy, tidak lagi tampak seperti bidang warna solid */
.income-btn, .expense-btn, .primary, .reset-btn {
  -webkit-backdrop-filter: blur(12px) saturate(1.55) !important;
  backdrop-filter: blur(12px) saturate(1.55) !important;

  box-shadow: 0 8px 20px rgba(0,0,0,.16), inset 0 1.5px 0 rgba(255,255,255,.42), inset 0 -1px 0 rgba(0,0,0,.08) !important;
}
.income-btn { background: linear-gradient(135deg,rgba(219,255,231,.19),rgba(67,160,105,.12)),rgba(17,83,49,.09) !important; }
.expense-btn { background: linear-gradient(135deg,rgba(184,255,207,.20),rgba(44,133,82,.13)),rgba(13,75,43,.10) !important; }

/* Tetap fixed di ponsel: jangan ubah menjadi scroll pada media query lama. */
@media (max-width: 600px) {
  body::before { position: fixed; }
  .balance-card, .panel {

/* =========================================================
   DOMPETQ V7.1 — STATIC BOTANICAL BACKGROUND
   Kunci ukuran wallpaper pada small viewport mobile agar
   address-bar browser tidak memicu efek zoom/parallax.
   Tidak mengubah material kaca, navigasi, atau fungsi aplikasi.
   ========================================================= */
html, body {
  background-color: #050708 !important;
}
body {
  background: transparent !important;
  background-attachment: initial !important;
  isolation: isolate;
}
body::before {
  content: "" !important;
  position: fixed !important;
  top: 0 !important;
  left: 0 !important;
  right: auto !important;
  bottom: auto !important;
  width: 100vw !important;
  height: 100vh !important;
  inset: 0 auto auto 0 !important;
  z-index: -1 !important;
  pointer-events: none !important;
  transform: none !important;
  will-change: auto !important;
  background-image:
    linear-gradient(180deg, rgba(2,5,7,.20), rgba(2,5,7,.32)),
    url("https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=1600&q=88"),
    url("assets/daun-hitam.jpg") !important;
  background-size: 100vw 100vh, 100vw 100vh, 100vw 100vh !important;
  background-position: center top, center top, center top !important;
  background-repeat: no-repeat !important;
  background-attachment: initial !important;
}
/* svh tidak berubah ketika toolbar Chrome Android mengembang/mengecil. */
@supports (height: 100svh) {
  body::before {
    height: 100svh !important;
    background-size: 100vw 100svh, 100vw 100svh, 100vw 100svh !important;
  }
}
@media (max-width: 600px) {
  body { background-attachment: initial !important; }
  body::before {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    height: 100svh !important;
    transform: none !important;
    will-change: auto !important;
  }
}

</style>
</head>

<body>

<div class="container">

<!-- SALDO -->

<section class="balance-card">

  <small>SISA SALDO</small>

  <div class="balance" id="balance">Rp0</div>

  <div class="summary-tabs" id="summaryTabs" role="tablist" aria-label="Ringkasan saldo">
    <svg class="summary-wave" id="summaryWave" aria-hidden="true" viewBox="0 0 400 66" preserveAspectRatio="none">
      <path class="wave-soft" id="waveSoft" d="M 0 58 L 400 58"></path>
      <path class="wave-glow" id="waveGlow" d="M 0 58 L 400 58"></path>
      <path class="wave-core" id="waveCore" d="M 0 58 L 400 58"></path>
    </svg>
    <button class="summary-tab" type="button" role="tab" id="tab-funds"
      aria-label="Dana awal" title="Dana awal" aria-controls="summaryDetail" aria-selected="true" onclick="selectSummaryTab(0)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5"></rect><path d="M3 9h18M7 15h.01M16 13h5"></path><path d="M6 6V4.8A1.8 1.8 0 0 1 7.8 3H19"></path></svg>
    </button>
    <button class="summary-tab" type="button" role="tab" id="tab-income"
      aria-label="Pemasukan" title="Pemasukan" aria-controls="summaryDetail" aria-selected="false" onclick="selectSummaryTab(1)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 17 10 11l4 4 6-8"></path><path d="M14 7h6v6"></path></svg>
    </button>
    <button class="summary-tab" type="button" role="tab" id="tab-expense"
      aria-label="Pengeluaran" title="Pengeluaran" aria-controls="summaryDetail" aria-selected="false" onclick="selectSummaryTab(2)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 7 6 6 4-4 6 8"></path><path d="M14 17h6v-6"></path></svg>
    </button>
    <button class="summary-tab" type="button" role="tab" id="tab-count"
      aria-label="Transaksi" title="Transaksi" aria-controls="summaryDetail" aria-selected="false" onclick="selectSummaryTab(3)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h8l4 4v14H7z"></path><path d="M15 3v5h5M10 12h6M10 16h6"></path></svg>
    </button>
  </div>

  <div class="summary-detail" id="summaryDetail" role="tabpanel" aria-live="polite">
    <span id="summaryLabel">Dana awal</span>
    <strong id="summaryValue">Rp0</strong>
  </div>
</section>

<!-- TAMBAH TRANSAKSI -->

<section class="panel">

  <h3>Tambah transaksi</h3>

  <label>KETERANGAN</label>

  <input
    type="text"
    id="description"
    maxlength="70"
    placeholder=""
  >

  <label>JUMLAH (RP)</label>

  <input
    type="number"
    id="amount"
    min="1"
    step="1"
    placeholder=""
  >

  <div class="buttons">

    <button class="income-btn"
      onclick="addTransaction('income')">
      + Pemasukan
    </button>

    <button class="expense-btn"
      onclick="addTransaction('expense')">
      − Pengeluaran
    </button>

  </div>

</section>

<!-- RIWAYAT TRANSAKSI -->

<section class="panel">

  <h3>Riwayat transaksi</h3>

  <div id="transactions">

    <div class="empty">
      Belum ada transaksi.
    </div>

  </div>

</section>

<!-- DANA AWAL -->

<section class="panel">

  <h3>Dana yang disiapkan</h3>

  <label>JUMLAH DANA (RP)</label>

  <input
    type="number"
    id="startingFunds"
    min="0"
    step="1"
    placeholder=""
  >

  <button class="primary" onclick="saveFunds()">
    Simpan dana awal
  </button>

</section>


<footer class="app-footer">
  <button class="reset-btn" type="button" onclick="resetAllData()">
    RESET SEMUA DATA
  </button>
  <small class="footer-note">Menghapus dana awal dan seluruh riwayat transaksi.</small>
</footer>

</div>

<script>

const KEY = "greenledger-simple";

let data = {
  funds: 0,
  transactions: []
};

// FORMAT RUPIAH

function rupiah(value) {

  return new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    maximumFractionDigits: 0
  }).format(value || 0);

}

// SIMPAN DATA

function save() {
  localStorage.setItem(KEY, JSON.stringify(data));
}

// AMBIL DATA

function load() {

  try {

    const saved = JSON.parse(
      localStorage.getItem(KEY)
    );

    if (saved && typeof saved === "object") {

      data.funds = Math.max(0, Number(saved.funds) || 0);

      data.transactions = Array.isArray(saved.transactions)
        ? saved.transactions.filter(t =>
            t &&
            (t.type === "income" || t.type === "expense") &&
            Number.isFinite(Number(t.amount)) &&
            Number(t.amount) > 0 &&
            typeof t.description === "string"
          )
        : [];

    }

  } catch (e) {

    console.warn("Data tidak dapat dibaca", e);

  }

}

// HITUNG SALDO

function calculate() {

  let income = 0;
  let expense = 0;

  data.transactions.forEach(t => {

    if (t.type === "income") {
      income += Number(t.amount);
    } else {
      expense += Number(t.amount);
    }

  });

  return {
    income,
    expense,
    balance: data.funds + income - expense
  };

}

// TAB RINGKASAN SALDO
let activeSummaryTab = 0;

function selectSummaryTab(index, followPointer = false) {
  const nextIndex = Math.max(0, Math.min(3, Number(index) || 0));
  const previousIndex = activeSummaryTab;
  const tabs = Array.from(document.querySelectorAll(".summary-tab"));
  if (!tabs.length) return;
  activeSummaryTab = nextIndex;
  tabs.forEach((tab, i) => {
    const active = i === nextIndex;
    tab.setAttribute("aria-selected", String(active));
    tab.tabIndex = active ? 0 : -1;
  });

  // During hover/drag the wave follows the actual pointer coordinate,
  // not the center of each tab. Click/keyboard navigation eases to tab center.
  if (!followPointer && window.moveSummaryWaveToTab) {
    window.moveSummaryWaveToTab(nextIndex);
  }
  if (previousIndex !== nextIndex) {
    updateSummaryDetail(nextIndex > previousIndex ? 1 : -1);
  }
}

function initSummaryPointerFollow() {
  const track = document.getElementById("summaryTabs");
  const tabs = Array.from(document.querySelectorAll(".summary-tab"));
  const wave = document.getElementById("summaryWave");
  if (!track || !wave || !tabs.length || track.dataset.liquidWaveReady === "true") return;
  track.dataset.liquidWaveReady = "true";

  let currentX = 0, targetX = 0, raf = 0;
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const width = () => track.clientWidth;
  const centerFor = (index) => {
    const r = tabs[index].getBoundingClientRect();
    const tr = track.getBoundingClientRect();
    return r.left + r.width / 2 - tr.left;
  };
  const makePath = (x) => {
    const w = width(), base = 58, peak = 13, half = Math.min(39, w / 8);
    const left = Math.max(0, x - half), right = Math.min(w, x + half);
    const topL = Math.max(0, x - 13), topR = Math.min(w, x + 13);
    return `M 0 ${base} L ${left} ${base} C ${left+18} ${base}, ${topL-13} ${peak}, ${topL} ${peak} L ${topR} ${peak} C ${topR+13} ${peak}, ${right-18} ${base}, ${right} ${base} L ${w} ${base}`;
  };
  const paint = () => {
    wave.setAttribute("viewBox", `0 0 ${Math.max(1, width())} 66`);
    const d = makePath(currentX);
    ["waveSoft","waveGlow","waveCore"].forEach(id => {
      const p = document.getElementById(id);
      if (p) p.setAttribute("d", d);
    });
  };
  const animate = () => {
    const delta = targetX - currentX;
    // A damped easing step avoids abrupt jumps while remaining responsive.
    currentX += delta * (reduced ? 1 : .14);
    if (Math.abs(delta) < .12) currentX = targetX;
    paint();
    if (Math.abs(targetX-currentX) > .12) raf = requestAnimationFrame(animate);
    else raf = 0;
  };
  const setWaveTarget = (x) => {
    targetX = Math.max(0, Math.min(width(), x));
    if (reduced) {
      currentX = targetX;
      paint();
    } else if (!raf) {
      raf = requestAnimationFrame(animate);
    }
  };
  window.moveSummaryWaveToTab = (index) => setWaveTarget(centerFor(index));

  const indexAt = (clientX) => {
    let best = 0, distance = Infinity;
    tabs.forEach((tab,i) => {
      const r=tab.getBoundingClientRect(), d=Math.abs(clientX-(r.left+r.width/2));
      if(d<distance){distance=d;best=i;}
    });
    return best;
  };
  const followPointer = (clientX) => {
    const rect = track.getBoundingClientRect();
    setWaveTarget(clientX - rect.left);
    const i = indexAt(clientX);
    if (i !== activeSummaryTab) selectSummaryTab(i, true);
  };

  let dragging=false, pointerId=null;
  track.addEventListener("pointerenter", e => {
    if(e.pointerType==="mouse") followPointer(e.clientX);
  });
  track.addEventListener("pointermove", e => {
    if(e.pointerType==="mouse" || (dragging && e.pointerId===pointerId)) {
      followPointer(e.clientX);
    }
  });
  track.addEventListener("pointerdown", e => {
    if(e.pointerType!=="mouse"){
      dragging=true;
      pointerId=e.pointerId;
      track.setPointerCapture?.(e.pointerId);
      followPointer(e.clientX);
    }
  });
  const finish=e=>{if(e.pointerId===pointerId){dragging=false;pointerId=null;}};
  track.addEventListener("pointerup",finish);
  track.addEventListener("pointercancel",finish);
  track.addEventListener("lostpointercapture",finish);
  track.addEventListener("pointerleave", e => {
    if(e.pointerType==="mouse") setWaveTarget(centerFor(activeSummaryTab));
  });
  window.addEventListener("resize",()=>{
    targetX=centerFor(activeSummaryTab);
    currentX=targetX;
    paint();
  });
  currentX=targetX=centerFor(activeSummaryTab);
  paint();
}

function updateSummaryDetail(direction = 0) {
  const detail = document.getElementById("summaryDetail");
  const label = document.getElementById("summaryLabel");
  const value = document.getElementById("summaryValue");
  const total = calculate();
  const summaries = [
    { label: "Dana awal", value: rupiah(data.funds) },
    { label: "Total pemasukan", value: rupiah(total.income) },
    { label: "Total pengeluaran", value: rupiah(total.expense) },
    { label: "Jumlah transaksi", value: String(data.transactions.length) }
  ];
  const summary = summaries[activeSummaryTab];

  if (direction && !window.matchMedia("(prefers-reduced-motion: reduce)").matches &&
      typeof detail.animate === "function") {
    detail.animate([
      { opacity: .45, transform: `translateX(${direction * 12}px) scale(.985)` },
      { opacity: 1, transform: "translateX(0) scale(1)" }
    ], { duration: 300, easing: "cubic-bezier(.2,.8,.2,1)" });
  }

  label.textContent = summary.label;
  value.textContent = summary.value;
}

// TAMPILKAN DATA

function render() {

  const total = calculate();

  document.getElementById("balance").textContent =
    rupiah(total.balance);

  updateSummaryDetail();

  document.getElementById("startingFunds").value =
    data.funds || "";

  const container =
    document.getElementById("transactions");

  if (data.transactions.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Belum ada transaksi.<br>
        Silakan tambahkan pemasukan atau pengeluaran.
      </div>
    `;

    return;

  }

  const sorted = [...data.transactions].sort(
    (a,b) => b.id - a.id
  );

  container.innerHTML = sorted.map(t => {

    const isIncome = t.type === "income";

    const safeDescription = t.description.replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      })[c]
    );

    const date = new Date(t.id).toLocaleDateString(
      "id-ID",
      {
        day: "numeric",
        month: "short",
        year: "numeric"
      }
    );

    return `
      <div class="transaction">

        <div class="icon">
          ${isIncome ? "↙" : "↗"}
        </div>

        <div class="info">
          <strong>${safeDescription}</strong>
          <small>${date}</small>
        </div>

        <div class="amount ${isIncome ? "income" : "expense"}">
          ${isIncome ? "+" : "−"}${rupiah(t.amount)}
        </div>

        <button class="delete"
          onclick="deleteTransaction(${t.id})"
          aria-label="Hapus transaksi">
          ×
        </button>

      </div>
    `;

  }).join("");

}

// SIMPAN DANA AWAL

function saveFunds() {

  const value = Number(
    document.getElementById("startingFunds").value
  );

  if (!Number.isFinite(value) || value < 0) {

    alert("Masukkan jumlah dana yang valid.");
    return;

  }

  data.funds = value;

  save();
  render();

}

// TAMBAH TRANSAKSI

function addTransaction(type) {

  const description =
    document.getElementById("description").value.trim();

  const amount =
    Number(document.getElementById("amount").value);

  if (!description) {

    alert("Masukkan keterangan transaksi.");
    document.getElementById("description").focus();
    return;

  }

  if (!Number.isFinite(amount) || amount <= 0) {

    alert("Masukkan jumlah yang valid.");
    document.getElementById("amount").focus();
    return;

  }

  data.transactions.push({

    id: Date.now(),
    type: type,
    description: description,
    amount: amount

  });

  save();

  document.getElementById("description").value = "";
  document.getElementById("amount").value = "";

  render();

}

// HAPUS TRANSAKSI

function deleteTransaction(id) {

  if (!confirm("Hapus transaksi ini?")) return;

  data.transactions = data.transactions.filter(
    t => t.id !== id
  );

  save();
  render();

}

// RESET SELURUH DATA
function resetAllData() {

  const confirmed = confirm(
    "PERINGATAN!\n\nSemua data DOMPETQ akan dihapus permanen, termasuk dana awal dan seluruh riwayat transaksi.\n\nApakah Anda yakin ingin melanjutkan?"
  );

  if (!confirmed) return;

  // Hapus data tersimpan dan kembalikan aplikasi ke kondisi awal.
  localStorage.removeItem(KEY);

  data = {
    funds: 0,
    transactions: []
  };

  document.getElementById("description").value = "";
  document.getElementById("amount").value = "";

  render();
  alert("Semua data berhasil direset.");
}

// Navigasi tab dapat dioperasikan dengan tombol panah keyboard.
document.getElementById("summaryTabs").addEventListener("keydown", event => {
  if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
  event.preventDefault();

  let next = activeSummaryTab;
  if (event.key === "ArrowRight") next = (activeSummaryTab + 1) % 4;
  if (event.key === "ArrowLeft") next = (activeSummaryTab + 3) % 4;
  if (event.key === "Home") next = 0;
  if (event.key === "End") next = 3;

  selectSummaryTab(next);
  document.querySelectorAll(".summary-tab")[next].focus();
});

// JALANKAN APLIKASI

load();
selectSummaryTab(0);

window.addEventListener("load", initSummaryPointerFollow);

render();

</script>
