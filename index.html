<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#dce9df">
<title>DOMPETQ - Catatan Keuangan</title>

<style>
:root {
  --bg: #dce9df;
  --green: #347b55;
  --green-dark: #245c3d;
  --green-soft: #b9d4c0;
  --dark: #244333;
  --muted: #718879;
  --shadow: #b8c7bb;
  --light: #fafffb;
  --red: #bd6868;
}

* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--dark);
}

.container {
  max-width: 600px;
  margin: auto;
  padding: 24px 18px 50px;
}

header {
  margin-bottom: 25px;
  text-align: center;
  padding: 12px 0 8px;
}

.hero-logo {
  display: block;
  width: min(100%, 238px);
  height: auto;
  aspect-ratio: 3 / 2;
  object-fit: contain;
  margin: 0 auto 14px;
  padding: 7px;
  border-radius: 18px;
  background: linear-gradient(145deg, #07110b, #14251a);
  border: 1px solid rgba(255,255,255,.42);
  box-shadow: 0 9px 22px rgba(20, 55, 34, .24),
              inset 0 1px 0 rgba(255,255,255,.16);
}

header h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: 3px;
  font-weight: 800;
  color: var(--green-dark);
}

header p {
  color: var(--muted);
  font-size: 13px;
  margin-top: 7px;
}

.app-footer {
  text-align: center;
  padding: 8px 0 20px;
  margin-top: 4px;
}

.reset-btn {
  width: 100%;
  color: #fff;
  background: linear-gradient(135deg, #c45f5f, #a83f3f);
  box-shadow: 5px 5px 10px var(--shadow),
             -5px -5px 10px var(--light);
}

.footer-note {
  display: block;
  color: var(--muted);
  font-size: 10px;
  margin-top: 11px;
}

/* SALDO */

.balance-card {
  background: linear-gradient(135deg,#347b55,#4c966b);
  color: white;
  padding: 25px;
  border-radius: 24px;
  box-shadow: 8px 8px 18px var(--shadow),
             -8px -8px 18px var(--light);
  margin-bottom: 22px;
}

.balance-card small {
  opacity: .8;
  font-size: 12px;
}

.balance {
  font-size: 34px;
  font-weight: bold;
  margin: 12px 0 25px;
  overflow-wrap: anywhere;
}

/* NAVIGASI RINGKASAN SALDO */
.summary-tabs {
  position: relative;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 3px;
  padding: 4px;
  border-radius: 14px;
  background: rgba(13, 59, 35, .22);
  border: 1px solid rgba(255,255,255,.14);
  overflow: hidden;
  isolation: isolate;
  perspective: 760px;
}

.summary-indicator {
  position: absolute;
  z-index: 0;
  top: 4px;
  bottom: 4px;
  left: 4px;
  width: calc((100% - 8px - 9px) / 4);
  border-radius: 10px;
  background: linear-gradient(135deg, rgba(255,255,255,.52), rgba(255,255,255,.20));
  border: 1px solid rgba(255,255,255,.55);
  box-shadow: 0 4px 14px rgba(8, 38, 22, .22),
              inset 0 1px 0 rgba(255,255,255,.58),
              inset 0 -1px 0 rgba(255,255,255,.12);
  backdrop-filter: blur(16px) saturate(1.35);
  -webkit-backdrop-filter: blur(16px) saturate(1.35);
  transform: translateX(calc(var(--tab-index, 0) * (100% + 3px))) scaleX(1);
  transform-origin: center center;
  transform-style: preserve-3d;
  backface-visibility: hidden;
  will-change: transform, filter;
  pointer-events: none;
}

.summary-indicator::after {
  content: "";
  position: absolute;
  inset: 1px;
  border-radius: inherit;
  background: linear-gradient(110deg, transparent 18%, rgba(255,255,255,.58) 48%, transparent 76%);
  transform: translateX(-135%);
  opacity: .75;
  pointer-events: none;
}

.summary-indicator.is-shining::after {
  animation: summarySheen .62s ease-in-out both;
}

@keyframes summarySheen {
  from { transform: translateX(-145%); opacity: .12; }
  45% { opacity: .9; }
  to { transform: translateX(145%); opacity: .12; }
}

.summary-tab {
  position: relative;
  z-index: 1;
  min-width: 0;
  padding: 12px 3px;
  border-radius: 10px;
  background: transparent;
  color: rgba(255,255,255,.76);
  font-size: 10px;
  line-height: 1.2;
  white-space: nowrap;
  transition: color .25s ease;
}

.summary-tab[aria-selected="true"] {
  color: #17472e;
  text-shadow: 0 1px 0 rgba(255,255,255,.35);
}

.summary-tab:focus-visible {
  outline: 2px solid #fff;
  outline-offset: -2px;
}

.summary-detail {
  min-height: 78px;
  margin-top: 15px;
  padding: 13px 15px;
  border-radius: 14px;
  background: rgba(255,255,255,.14);
  border: 1px solid rgba(255,255,255,.12);
  animation: summaryReveal .32s ease both;
}

.summary-detail span {
  display: block;
  font-size: 11px;
  opacity: .82;
  margin-bottom: 8px;
}

.summary-detail strong {
  display: block;
  font-size: 21px;
  overflow-wrap: anywhere;
}

@keyframes summaryReveal {
  from { opacity: 0; transform: translateY(7px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .summary-indicator, .summary-tab, .summary-detail {
    transition: none;
    animation: none;
  }
}

/* PANEL */

.panel {
  background: var(--bg);
  padding: 22px;
  border-radius: 20px;
  box-shadow: 7px 7px 15px var(--shadow),
             -7px -7px 15px var(--light);
  margin-bottom: 22px;
}

.panel h3 {
  margin: 0 0 18px;
  font-size: 16px;
}

/* INPUT */

label {
  display: block;
  font-size: 11px;
  color: var(--muted);
  font-weight: bold;
  margin: 13px 0 7px;
}

input {
  width: 100%;
  padding: 14px;
  border: none;
  outline: none;
  border-radius: 12px;
  background: var(--bg);
  color: var(--dark);
  box-shadow: inset 4px 4px 8px var(--shadow),
              inset -4px -4px 8px var(--light);
  font-size: 14px;
}

button {
  border: none;
  cursor: pointer;
  font-weight: bold;
  border-radius: 12px;
  padding: 14px;
  font-size: 13px;
  transition: .2s ease;
}

button:active {
  transform: scale(.97);
}

/* TOMBOL SIMPAN */

.primary {
  width: 100%;
  color: white;
  background: linear-gradient(135deg,#4c966b,#347b55);
  box-shadow: 5px 5px 10px var(--shadow),
             -5px -5px 10px var(--light);
  margin-top: 17px;
}

/* TOMBOL TRANSAKSI */

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 18px;
}

/* PENGELUARAN - TOMBOL UTAMA */

.expense-btn {
  background: linear-gradient(145deg,#245f3e,#17472e);
  color: #ffffff;
  box-shadow: 5px 5px 10px #aebfb1,
             -5px -5px 10px #f4fff6;
}

.expense-btn:hover {
  background: linear-gradient(145deg,#1d5134,#123d27);
}

/* PEMASUKAN - TOMBOL SEKUNDER */

.income-btn {
  background: var(--bg);
  color: var(--green);
  box-shadow: 5px 5px 10px var(--shadow),
             -5px -5px 10px var(--light);
}

.income-btn:hover {
  color: var(--green-dark);
  background: #d3e4d7;
}

/* TRANSAKSI */

.transaction {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 0;
  border-bottom: 1px solid #b8c7bb80;
}

.transaction:last-child {
  border-bottom: none;
}

.icon {
  width: 38px;
  height: 38px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  background: var(--bg);
  box-shadow: 4px 4px 8px var(--shadow),
             -4px -4px 8px var(--light);
  font-size: 18px;
  flex-shrink: 0;
}

.info {
  flex: 1;
  min-width: 0;
}

.info strong {
  display: block;
  font-size: 13px;
  overflow-wrap: anywhere;
}

.info small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 5px;
}

.amount {
  font-size: 12px;
  font-weight: bold;
  white-space: nowrap;
}

.income {
  color: var(--green);
}

.expense {
  color: var(--red);
}

.delete {
  background: none;
  color: var(--muted);
  font-size: 19px;
  padding: 4px;
}

.empty {
  text-align: center;
  padding: 25px 5px;
  color: var(--muted);
  font-size: 12px;
}

@media(max-width:380px) {
  .balance {
    font-size: 27px;
  }

  .panel {
    padding: 17px;
  }

  .buttons {
    gap: 9px;
  }

  .buttons button {
    padding: 13px 8px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="container">

<!-- SALDO -->

<section class="balance-card">

  <small>SISA SALDO</small>

  <div class="balance" id="balance">Rp0</div>

  <div class="summary-tabs" id="summaryTabs" role="tablist" aria-label="Ringkasan saldo">
    <span class="summary-indicator" id="summaryIndicator" aria-hidden="true"></span>
    <button class="summary-tab" type="button" role="tab" id="tab-funds"
      aria-controls="summaryDetail" aria-selected="true" onclick="selectSummaryTab(0)">Dana awal</button>
    <button class="summary-tab" type="button" role="tab" id="tab-income"
      aria-controls="summaryDetail" aria-selected="false" onclick="selectSummaryTab(1)">Pemasukan</button>
    <button class="summary-tab" type="button" role="tab" id="tab-expense"
      aria-controls="summaryDetail" aria-selected="false" onclick="selectSummaryTab(2)">Pengeluaran</button>
    <button class="summary-tab" type="button" role="tab" id="tab-count"
      aria-controls="summaryDetail" aria-selected="false" onclick="selectSummaryTab(3)">Transaksi</button>
  </div>

  <div class="summary-detail" id="summaryDetail" role="tabpanel" aria-live="polite">
    <span id="summaryLabel">Dana awal</span>
    <strong id="summaryValue">Rp0</strong>
  </div>
</section>

<!-- DANA AWAL -->

<section class="panel">

  <h3>Dana yang disiapkan</h3>

  <label>JUMLAH DANA (RP)</label>

  <input
    type="number"
    id="startingFunds"
    min="0"
    step="1"
    placeholder=""
  >

  <button class="primary" onclick="saveFunds()">
    Simpan dana awal
  </button>

</section>

<!-- TAMBAH TRANSAKSI -->

<section class="panel">

  <h3>Tambah transaksi</h3>

  <label>KETERANGAN</label>

  <input
    type="text"
    id="description"
    maxlength="70"
    placeholder=""
  >

  <label>JUMLAH (RP)</label>

  <input
    type="number"
    id="amount"
    min="1"
    step="1"
    placeholder=""
  >

  <div class="buttons">

    <button class="income-btn"
      onclick="addTransaction('income')">
      + Pemasukan
    </button>

    <button class="expense-btn"
      onclick="addTransaction('expense')">
      − Pengeluaran
    </button>

  </div>

</section>

<!-- RIWAYAT TRANSAKSI -->

<section class="panel">

  <h3>Riwayat transaksi</h3>

  <div id="transactions">

    <div class="empty">
      Belum ada transaksi.
    </div>

  </div>

</section>

<footer class="app-footer">
  <button class="reset-btn" type="button" onclick="resetAllData()">
    RESET SEMUA DATA
  </button>
  <small class="footer-note">Menghapus dana awal dan seluruh riwayat transaksi.</small>
</footer>

</div>

<script>

const KEY = "greenledger-simple";

let data = {
  funds: 0,
  transactions: []
};

// FORMAT RUPIAH

function rupiah(value) {

  return new Intl.NumberFormat("id-ID", {
    style: "currency",
    currency: "IDR",
    maximumFractionDigits: 0
  }).format(value || 0);

}

// SIMPAN DATA

function save() {
  localStorage.setItem(KEY, JSON.stringify(data));
}

// AMBIL DATA

function load() {

  try {

    const saved = JSON.parse(
      localStorage.getItem(KEY)
    );

    if (saved && typeof saved === "object") {

      data.funds = Math.max(0, Number(saved.funds) || 0);

      data.transactions = Array.isArray(saved.transactions)
        ? saved.transactions.filter(t =>
            t &&
            (t.type === "income" || t.type === "expense") &&
            Number.isFinite(Number(t.amount)) &&
            Number(t.amount) > 0 &&
            typeof t.description === "string"
          )
        : [];

    }

  } catch (e) {

    console.warn("Data tidak dapat dibaca", e);

  }

}

// HITUNG SALDO

function calculate() {

  let income = 0;
  let expense = 0;

  data.transactions.forEach(t => {

    if (t.type === "income") {
      income += Number(t.amount);
    } else {
      expense += Number(t.amount);
    }

  });

  return {
    income,
    expense,
    balance: data.funds + income - expense
  };

}

// TAB RINGKASAN SALDO
let activeSummaryTab = 0;

function selectSummaryTab(index) {
  const nextIndex = Math.max(0, Math.min(3, Number(index) || 0));
  const previousIndex = activeSummaryTab;
  if (nextIndex === previousIndex) return;

  const tabs = Array.from(document.querySelectorAll(".summary-tab"));
  const track = document.getElementById("summaryTabs");
  const indicator = document.getElementById("summaryIndicator");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  activeSummaryTab = nextIndex;
  tabs.forEach((tab, i) => {
    const active = i === activeSummaryTab;
    tab.setAttribute("aria-selected", String(active));
    tab.tabIndex = active ? 0 : -1;
  });

  const trackRect = track.getBoundingClientRect();
  const indicatorBaseLeft = indicator.offsetLeft;
  const previousRect = tabs[previousIndex].getBoundingClientRect();
  const targetRect = tabs[nextIndex].getBoundingClientRect();
  const fromX = previousRect.left - trackRect.left - indicatorBaseLeft;
  const targetX = targetRect.left - trackRect.left - indicatorBaseLeft;

  if (indicator._slideAnimation) indicator._slideAnimation.cancel();

  if (reduceMotion) {
    indicator.style.transform = `translateX(${targetX}px)`;
    indicator._currentX = targetX;
  } else {
    const delta = targetX - fromX;
    const direction = delta >= 0 ? 1 : -1;
    const distance = Math.abs(delta);
    const stretch = distance > 1 ? 1.24 : 1;

    indicator.style.transform = `translateX(${fromX}px) scaleX(1)`;
    indicator._slideAnimation = indicator.animate([
      { offset: 0, transform: `translateX(${fromX}px) scaleX(1)`, filter: "brightness(1)" },
      { offset: .28, transform: `translateX(${fromX + delta * .34}px) scaleX(${stretch})`, filter: "brightness(1.30)" },
      { offset: .62, transform: `translateX(${fromX + delta * .82}px) scaleX(.88)`, filter: "brightness(1.16)" },
      { offset: .84, transform: `translateX(${targetX + direction * 5}px) scaleX(1.06)`, filter: "brightness(1.08)" },
      { offset: 1, transform: `translateX(${targetX}px) scaleX(1)`, filter: "brightness(1)" }
    ], {
      duration: 680,
      easing: "cubic-bezier(.20,.82,.22,1)",
      fill: "forwards"
    });

    indicator._currentX = targetX;
    indicator._slideAnimation.onfinish = () => {
      indicator.style.transform = `translateX(${targetX}px) scaleX(1)`;
      indicator._slideAnimation = null;
    };

    indicator.classList.remove("is-shining");
    void indicator.offsetWidth;
    indicator.classList.add("is-shining");
  }

  updateSummaryDetail(nextIndex > previousIndex ? 1 : -1);
}

function updateSummaryDetail(direction = 0) {
  const detail = document.getElementById("summaryDetail");
  const total = calculate();
  const summaries = [
    { label: "Dana awal", value: rupiah(data.funds) },
    { label: "Total pemasukan", value: rupiah(total.income) },
    { label: "Total pengeluaran", value: rupiah(total.expense) },
    { label: "Jumlah transaksi", value: String(data.transactions.length) }
  ];

  document.getElementById("summaryLabel").textContent =
    summaries[activeSummaryTab].label;
  document.getElementById("summaryValue").textContent =
    summaries[activeSummaryTab].value;

  if (direction && !window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    detail.animate([
      { opacity: 0, transform: `translateX(${direction * 16}px) rotateY(${direction * -8}deg)` },
      { opacity: 1, transform: "translateX(0) rotateY(0deg)" }
    ], { duration: 360, easing: "cubic-bezier(.2,.8,.2,1)" });
  }
}

// TAMPILKAN DATA

function render() {

  const total = calculate();

  document.getElementById("balance").textContent =
    rupiah(total.balance);

  updateSummaryDetail();

  document.getElementById("startingFunds").value =
    data.funds || "";

  const container =
    document.getElementById("transactions");

  if (data.transactions.length === 0) {

    container.innerHTML = `
      <div class="empty">
        Belum ada transaksi.<br>
        Silakan tambahkan pemasukan atau pengeluaran.
      </div>
    `;

    return;

  }

  const sorted = [...data.transactions].sort(
    (a,b) => b.id - a.id
  );

  container.innerHTML = sorted.map(t => {

    const isIncome = t.type === "income";

    const safeDescription = t.description.replace(
      /[&<>"']/g,
      c => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      })[c]
    );

    const date = new Date(t.id).toLocaleDateString(
      "id-ID",
      {
        day: "numeric",
        month: "short",
        year: "numeric"
      }
    );

    return `
      <div class="transaction">

        <div class="icon">
          ${isIncome ? "↙" : "↗"}
        </div>

        <div class="info">
          <strong>${safeDescription}</strong>
          <small>${date}</small>
        </div>

        <div class="amount ${isIncome ? "income" : "expense"}">
          ${isIncome ? "+" : "−"}${rupiah(t.amount)}
        </div>

        <button class="delete"
          onclick="deleteTransaction(${t.id})"
          aria-label="Hapus transaksi">
          ×
        </button>

      </div>
    `;

  }).join("");

}

// SIMPAN DANA AWAL

function saveFunds() {

  const value = Number(
    document.getElementById("startingFunds").value
  );

  if (!Number.isFinite(value) || value < 0) {

    alert("Masukkan jumlah dana yang valid.");
    return;

  }

  data.funds = value;

  save();
  render();

}

// TAMBAH TRANSAKSI

function addTransaction(type) {

  const description =
    document.getElementById("description").value.trim();

  const amount =
    Number(document.getElementById("amount").value);

  if (!description) {

    alert("Masukkan keterangan transaksi.");
    document.getElementById("description").focus();
    return;

  }

  if (!Number.isFinite(amount) || amount <= 0) {

    alert("Masukkan jumlah yang valid.");
    document.getElementById("amount").focus();
    return;

  }

  data.transactions.push({

    id: Date.now(),
    type: type,
    description: description,
    amount: amount

  });

  save();

  document.getElementById("description").value = "";
  document.getElementById("amount").value = "";

  render();

}

// HAPUS TRANSAKSI

function deleteTransaction(id) {

  if (!confirm("Hapus transaksi ini?")) return;

  data.transactions = data.transactions.filter(
    t => t.id !== id
  );

  save();
  render();

}

// RESET SELURUH DATA
function resetAllData() {

  const confirmed = confirm(
    "PERINGATAN!\n\nSemua data DOMPETQ akan dihapus permanen, termasuk dana awal dan seluruh riwayat transaksi.\n\nApakah Anda yakin ingin melanjutkan?"
  );

  if (!confirmed) return;

  // Hapus data tersimpan dan kembalikan aplikasi ke kondisi awal.
  localStorage.removeItem(KEY);

  data = {
    funds: 0,
    transactions: []
  };

  document.getElementById("description").value = "";
  document.getElementById("amount").value = "";

  render();
  alert("Semua data berhasil direset.");
}

// Navigasi tab dapat dioperasikan dengan tombol panah keyboard.
document.getElementById("summaryTabs").addEventListener("keydown", event => {
  if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(event.key)) return;
  event.preventDefault();

  let next = activeSummaryTab;
  if (event.key === "ArrowRight") next = (activeSummaryTab + 1) % 4;
  if (event.key === "ArrowLeft") next = (activeSummaryTab + 3) % 4;
  if (event.key === "Home") next = 0;
  if (event.key === "End") next = 3;

  selectSummaryTab(next);
  document.querySelectorAll(".summary-tab")[next].focus();
});

// JALANKAN APLIKASI

load();
selectSummaryTab(0);
render();

</script>

</body>
</html>
